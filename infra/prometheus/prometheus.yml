global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: gsip

# Alertmanager config (optional — add when needed)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # FastAPI backend — exposes /metrics via prometheus-fastapi-instrumentator
  - job_name: gsip-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8000']
    scrape_interval: 10s

  # PostgreSQL — via postgres_exporter (add to docker-compose if needed)
  # - job_name: postgresql
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Redis — via redis_exporter
  # - job_name: redis
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # Node/system metrics (add node_exporter to docker-compose if needed)
  # - job_name: node
  #   static_configs:
  #     - targets: ['node-exporter:9100']
