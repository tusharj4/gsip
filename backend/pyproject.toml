[tool.poetry]
name = "gsip-backend"
version = "0.1.0"
description = "GatiShakti Intelligence Platform — Backend API"
authors = ["GSIP Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"

# Web framework
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}

# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.0"
geoalchemy2 = "^0.15.0"

# Data validation
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"

# Geospatial
geopandas = "^0.14.0"
shapely = "^2.0.0"
fiona = "^1.9.0"
pyproj = "^3.6.0"
osmnx = "^1.9.0"

# Object storage
boto3 = "^1.34.0"

# AI
anthropic = "^0.28.0"

# PDF generation
weasyprint = "^62.0"
staticmap = "^0.5.4"

# Task queue
redis = "^5.0.0"
celery = "^5.4.0"

# HTTP
httpx = "^0.27.0"

# Observability
prometheus-fastapi-instrumentator = "^7.0.0"

# Utilities
python-multipart = "^0.0.9"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
orjson = "^3.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
ruff = "^0.4.0"
mypy = "^1.10.0"
types-redis = "^4.6.0"
playwright = "^1.44.0"
pytest-playwright = "^0.5.0"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "A", "COM", "C4", "DTZ", "T20", "RET", "SIM"]
ignore = ["ANN101", "ANN102", "S101", "COM812"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
