name: GSIP CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests (PostGIS)
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_DB: gsip_test
          POSTGRES_USER: gsip
          POSTGRES_PASSWORD: gsip_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gsip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --with dev --no-root

      - name: Run backend unit tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://gsip:gsip_dev@localhost:5432/gsip_test
        run: |
          poetry run pytest ../tests/backend/ -v --tb=short \
            --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml

  frontend-typecheck:
    name: Frontend TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: ESLint
        working-directory: frontend
        run: npm run lint
        continue-on-error: true  # warn but don't fail on lint for now

  docker-build:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-typecheck]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t gsip-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t gsip-frontend:ci ./frontend
