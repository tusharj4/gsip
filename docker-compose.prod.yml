version: '3.9'

# Production overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# First-time SSL setup:
#   1. Set GSIP_DOMAIN in .env
#   2. Run: docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm certbot
#      to obtain Let's Encrypt certificates
#   3. Then start normally: docker compose ... up -d
#
# Certificate renewal (add to system cron):
#   0 12 * * * docker compose -f ... run --rm certbot renew --quiet && \
#              docker compose -f ... exec nginx nginx -s reload

services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-}

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    restart: always

  backend:
    build:
      context: ./backend
      target: prod
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --no-access-log
    environment:
      APP_ENV: production
      ENABLE_AUTH: "true"
      ENABLE_RATE_LIMIT: "true"
      LOG_LEVEL: WARNING
    restart: always
    volumes: []  # No source mount in prod — baked into image

  frontend:
    build:
      context: ./frontend
      target: prod
    restart: always
    volumes: []

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx-ssl.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    restart: always

  # One-shot container for Let's Encrypt certificate issuance/renewal
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    command: >
      certonly
      --webroot --webroot-path=/var/www/certbot
      --email ${CERT_EMAIL}
      --agree-tos
      --no-eff-email
      -d ${GSIP_DOMAIN}
    profiles:
      - certbot  # Only runs when explicitly included: docker compose --profile certbot up certbot

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${GSIP_DOMAIN}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    restart: always

  prometheus:
    restart: always

volumes:
  postgres_data:
  minio_data:
  geoserver_data:
  certbot_www:
  certbot_certs:
